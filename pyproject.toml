[project]
name = "voteit_org"
version = "1.0.0"
description = "VoteIT org internal housekeeping"
authors = [
    {name = "VoteIT dev team"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "voteit",
    "django"
]

[project.urls]
Homepage = "https://www.voteit.se/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voteit_org"]
exclude = ["**/tests/**"]

[tool.hatch.build.targets.sdist]
packages = ["voteit_org"]
exclude = [
  "**/tests/**"
]

[tool.ruff]
include = ["pyproject.toml", "voteit_org/**/*.py", "src/**/*.py"]
# Same as the voteit project.
lint.select = ["E4", "E7", "E9", "F", "TID251"]
lint.isort.force-single-line = true
lint.flake8-tidy-imports.banned-api."django_rq.job".msg = "Binds the redis connection at import, before the test runner moves it. Use voteit.core.decorators.job."

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "migrations"
]
